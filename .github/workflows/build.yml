name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Build Description (optional)'
        required: false
        type: string
        default: 'Manual build'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Prepare Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          keyStorePath="android/app/tefmanager.p12"
          keyStorePassword='EternalFuture@2026'
          keyAlias='TEFManager'

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyStorePath" || true
          fi

          if [ -s "$keyStorePath" ] && keytool -list \
              -storetype PKCS12 \
              -keystore "$keyStorePath" \
              -storepass "$keyStorePassword" \
              -alias "$keyAlias" >/dev/null 2>&1; then
            echo "Using the configured Android signing keystore"
          else
            rm -f "$keyStorePath"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore "$keyStorePath" \
              -alias "$keyAlias" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$keyStorePassword" \
              -keypass "$keyStorePassword" \
              -dname 'CN=TEFManager, OU=EternalFuture, O=EternalFuture, C=CN'
            echo "Generated a temporary Android signing keystore"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEFManager-arm64.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
